x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'
        tag: '{{.Name}}'

x-restart-policy: &restart-policy
    restart: unless-stopped

x-healthcheck-defaults: &healthcheck-defaults
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

# Postgres and Keycloak are NOT part of this stack: they run directly on the
# host. The restapi reaches them through host.docker.internal (see extra_hosts).
services:
    redis:
        image: redis:8.8-alpine
        <<: *restart-policy
        logging: *logging
        # Cache-only (TSE 24h, user:* 1h — all TTL-based). No persistence:
        # on restart the restapi simply repopulates. allkeys-lru evicts the
        # coldest keys when maxmemory is hit instead of OOM-killing the box.
        command: >-
            redis-server
            --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
            --save ""
            --appendonly no
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        # Bound to loopback: the restapi reaches it on the host, never exposed
        # to the network (nginx has no business talking to redis).
        ports:
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        networks:
            - db
        env_file:
            - ./.env
        healthcheck:
            <<: *healthcheck-defaults
            test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 192M
                reservations:
                    cpus: '0.05'
                    memory: 32M

    restapi:
        image: mab-restapi:${RESTAPI_TAG:-latest}
        build:
            # Context is the monorepo root so the pnpm workspace files are visible.
            context: ../..
            dockerfile: apps/restapi/Dockerfile
        <<: *restart-policy
        logging: *logging
        # Chrome (Puppeteer/TSE) crashes with Docker's default 64MB /dev/shm.
        shm_size: '1gb'
        # Extra runtime vars the explicit environment block doesn't cover
        # (OPENAI_API_KEY, PADRON_PATH, ...) are read from ./.env.
        env_file:
            - ./.env
        # Postgres and Keycloak live on the host; host.docker.internal resolves
        # to the host's gateway IP from inside the container.
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            # Postgres on the host (e.g. postgresql://mab:<pass>@host.docker.internal:5432/mab).
            # The host's postgres must listen on the docker bridge and allow it in pg_hba.conf.
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
            REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379

            # Keycloak — KC_BASE_URL MUST be the public URL that appears as the
            # `iss` claim in tokens (token validation compares against it).
            # KC_HEALTH_URL points at the host Keycloak's management endpoint
            # (e.g. http://host.docker.internal:9000/health).
            KC_BASE_URL: ${KC_PUBLIC_URL:?KC_PUBLIC_URL is required}
            KC_REALM: ${KC_REALM:-mab}
            KC_HEALTH_URL: ${KC_HEALTH_URL:?KC_HEALTH_URL is required}
            KC_REST_API_AUDIENCE: ${KC_REST_API_AUDIENCE:-restapi}
            KC_DASHBOARD_AUDIENCE: ${KC_DASHBOARD_AUDIENCE:-mab-admin}
            KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-restapi}
            KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?KC_ADMIN_CLIENT_SECRET is required}
            KC_MOBILE_CLIENT_ID: ${KC_MOBILE_CLIENT_ID:-mobile}

            # Frontend origins
            CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
            DASHBOARD_URL: ${DASHBOARD_URL:?DASHBOARD_URL is required}
            # NODE_ENV, HOST (0.0.0.0) and PORT (3000) are baked into the image.
        ports:
            - '${RESTAPI_PORT:-3000}:3000'
        networks:
            - db
            - frontend
        healthcheck:
            <<: *healthcheck-defaults
            test:
                [
                    'CMD-SHELL',
                    'node -e "fetch(''http://127.0.0.1:3000/api/v1/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
                ]
        depends_on:
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.25'
                    memory: 256M

networks:
    db: null
    frontend:
        driver: bridge
