services:
    postgres:
        image: postgres:18.3-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-mab}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mab}
            POSTGRES_DB: ${POSTGRES_DB:-mab}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mab} -d ${POSTGRES_DB:-mab}']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8.8-alpine
        restart: unless-stopped
        command: redis-server --requirepass ${REDIS_PASSWORD:-mab}
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data

    keycloak:
        image: quay.io/keycloak/keycloak:26.6
        restart: unless-stopped
        command: start-dev
        env_file:
            - ./.env
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mab}
            KC_DB_USERNAME: ${POSTGRES_USER:-mab}
            KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-mab}
            KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
            KC_HTTP_PORT: ${KEYCLOAK_PORT:-8080}
            KC_HOSTNAME_STRICT: false
            KC_HTTP_ENABLED: true
            KC_HOSTNAME_STRICT_HTTPS: false
        ports:
            - '${KEYCLOAK_PORT:-8080}:${KEYCLOAK_PORT:-8080}'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q 'UP' <&3",
                ]
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 30s
        depends_on:
            postgres:
                condition: service_healthy

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - '${MAILPIT_SMTP_PORT:-1025}:1025'
            - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
    postgres_data:
    redis_data:
