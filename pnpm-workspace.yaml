minimumReleaseAge: 1440
packages:
    - 'apps/*'
    - 'packages/*'
overrides:
    '@typescript-eslint/utils': '^8.59.4'
allowBuilds:
    '@nestjs/core': true
    '@swc/core': true
    chromedriver: true
    esbuild: true
    msgpackr-extract: true
    sharp: true
    unrs-resolver: true
minimumReleaseAgeExclude:
    - '@expo/cli@55.0.31'
    - '@expo/metro-config@55.0.22'
    - '@expo/router-server@55.0.17'
    - '@types/react@19.2.15'
    - babel-preset-expo@55.0.22
    - expo-file-system@55.0.21
    - expo-font@55.0.8
    - expo-modules-autolinking@55.0.23
    - expo-router@55.0.15
    - expo-server@55.0.10
    - expo-symbols@55.0.9
    - expo@55.0.25
    - '@expo/cli@56.1.13'
    - '@expo/package-manager@1.12.1'
    - '@expo/prebuild-config@56.0.14'
    - babel-preset-expo@56.0.14
    - expo-modules-core@56.0.14
    - expo@56.0.8
    - '@expo/ui@56.0.15'
    - expo-auth-session@56.0.13
    - expo-linking@56.0.13
    - expo-router@56.2.8
    - expo-dev-client@56.0.18
    - expo-dev-launcher@56.0.18
    - expo-dev-menu@56.0.16
